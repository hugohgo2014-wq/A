plugins { id 'com.android.application' }
android {
 namespace 'studio.renpy.mobile'
 compileSdk 35
 defaultConfig {
  applicationId 'studio.renpy.mobile'
  minSdk 26
  targetSdk 35
  versionCode 1
  versionName '1.0.0'
  ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
  externalNativeBuild { cmake { cppFlags '-std=c++17 -O2 -Wall -Wextra' } }
 }
 externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 buildTypes { debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }; release { minifyEnabled false } }
}

dependencies {
 implementation 'org.luaj:luaj-jse:3.0.1'
}
