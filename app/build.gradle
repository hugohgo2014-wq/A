plugins { id 'com.android.application' }

android {
    namespace 'com.revival.assistant'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.revival.assistant'
        minSdk 26
        targetSdk 32
        versionCode 1
        versionName '1.0.0'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake { cppFlags '-std=c++17 -O3 -fexceptions -frtti'; arguments '-DANDROID_STL=c++_shared' }
        }
    }
    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }
    sourceSets { main { assets.srcDir("$buildDir/generated/modelAssets") } }
    // Keep the large GGUF uncompressed inside the APK; the app copies it to private storage.
    androidResources { noCompress += ['gguf'] }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
}

// If models/gemma-3-1b-it-Q4_K_M.gguf exists at the project root, include it as an APK asset.
def packagedModel = rootProject.file('models/gemma-3-1b-it-Q4_K_M.gguf')
def generatedModelAssets = file("$buildDir/generated/modelAssets/models")
tasks.register('copyLocalModelAsset') {
    outputs.file(new File(generatedModelAssets, 'gemma-3-1b-it-Q4_K_M.gguf'))
    doLast {
        if (packagedModel.exists()) {
            generatedModelAssets.mkdirs()
            copy { from packagedModel; into generatedModelAssets }
            logger.lifecycle('Including local Gemma GGUF model in APK (large APK expected).')
        } else {
            logger.lifecycle('No local GGUF in models/: APK will ask user to import it.')
        }
    }
}
tasks.named('preBuild').configure { dependsOn('copyLocalModelAsset') }
